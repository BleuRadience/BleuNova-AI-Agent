name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with: 
          python-version: '3.11'  # Changed from 3.12
      - name: Create .env file
        run: |
          echo "WITTY_MODE=false" > .env
          echo "SANDBOX_TIMEOUT=5" >> .env
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint
        run: black --check .
      - name: Test
        run: pytest -v
